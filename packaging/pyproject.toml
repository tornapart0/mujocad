[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujocad-demo"
version = "0.6.0"
description = "Solarpunk parametric robot CAD and MuJoCo demo in Tay's Sensible Lang"
requires-python = ">=3.11,<3.13"
dependencies = [
  "build123d==0.13.0", "PySide6==6.12.0", "pyqtgraph==0.14.0",
  "mujoco==3.15.0", "coacd==1.0.14", "trimesh==5.1.1", "PyOpenGL==3.1.10", "shapely==2.2.0", ]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
training = ["gymnasium==1.2.1", "stable-baselines3==2.9.0", "torch==2.14.1"]

[project.scripts]
mujocad-demo = "mujocad_demo:main"

[project.urls]
Source = "https://github.com/tornapart0/mujocad"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mujocad_demo = ["*.mylang", "sources/*.mylang", "sources/*.txt", "sources/*.json", "sources/.wakatime-project", "sources/Examples/*.mjcad", "sources/vendor/*.md", "sources/vendor/*.json", "sources/vendor/mylang/*.py"]
